<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataSets - Web Extractor</title>
<link rel="stylesheet" href="/shell.css">
<style>
:root {
  --bg:#060c1a; --surface:#0e1e38; --border:#0f2040;
  --text:#e2e8f0; --muted:#4a6080; --blue:#3b82f6; --blue-l:#60a5fa;
  --green:#10b981; --green-l:#34d399; --red:#ef4444;
  --bg-card:#0f1f3d; --bg-input:#071428; --border-0:#0f2040; --border-1:#1a3050; --border-2:#2a4060;
  --text-1:#e2e8f0; --text-2:#94a3b8; --text-3:#4a6080;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.6 'Segoe UI',system-ui,sans-serif;}
body.has-sidebar{display:flex;}

/* ── Sidebar ── */
.sidebar{width:240px;min-height:100vh;background:linear-gradient(135deg,#065f46,#10b981);display:flex;flex-direction:column;flex-shrink:0;}
.sb-brand{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12);}
.sb-icon{width:34px;height:34px;background:rgba(255,255,255,.18);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.sb-icon svg{stroke:#fff;}
.sb-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:-.01em;}
.sb-tagline{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;}
.sb-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;text-decoration:none;color:rgba(255,255,255,.75);font-size:13px;transition:all .15s;border:none;background:none;cursor:pointer;width:100%;text-align:left;}
.sb-item svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0;}
.sb-item:hover{background:rgba(255,255,255,.12);color:#fff;}
.sb-item.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600;}
.sb-sep{height:1px;background:rgba(255,255,255,.1);margin:8px 10px;}
.sb-footer{padding:12px 10px;}
.sb-back{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;text-decoration:none;color:rgba(255,255,255,.6);font-size:12px;transition:all .15s;}
.sb-back svg{width:13px;height:13px;stroke:currentColor;}
.sb-back:hover{background:rgba(255,255,255,.1);color:#fff;}

/* ── Main ── */
.page-wrap{flex:1;min-height:100vh;overflow-y:auto;padding:28px 32px;}
.page-header{margin-bottom:24px;}
.page-title{font-size:20px;font-weight:700;color:var(--text-1);}
.page-sub{font-size:13px;color:var(--text-3);margin-top:3px;}

/* ── Cards ── */
.card{background:var(--bg-card);border:1px solid var(--border-1);border-radius:var(--radius);padding:20px;}
.card-title{font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.card-title span{font-size:11px;font-weight:400;color:var(--text-3);}

/* ── List ── */
.item-list{display:flex;flex-direction:column;gap:1px;}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border-0);border-radius:8px;cursor:pointer;transition:all .15s;}
.list-item:hover{border-color:var(--border-2);background:rgba(255,255,255,.03);}
.list-item.active{border-color:var(--green);background:rgba(16,185,129,.07);}
.list-item-info{display:flex;flex-direction:column;gap:2px;}
.list-item-name{font-size:13px;font-weight:600;color:var(--text-1);}
.list-item-meta{font-size:11px;color:var(--text-3);}
.list-item-actions{display:flex;gap:6px;align-items:center;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:inherit;}
.btn svg{width:13px;height:13px;stroke:currentColor;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#2563eb;}
.btn-secondary{background:var(--bg-input);color:var(--text-2);border:1px solid var(--border-1);}
.btn-secondary:hover{border-color:var(--border-2);color:var(--text-1);}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-danger:hover{background:rgba(239,68,68,.18);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Form ── */
.form-control{width:100%;background:var(--bg-input);border:1px solid var(--border-1);border-radius:7px;color:var(--text-1);font-size:13px;font-family:inherit;padding:8px 12px;outline:none;transition:border-color .15s;}
.form-control:focus{border-color:var(--green);}
.form-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.search-row{display:flex;gap:8px;margin-bottom:14px;}
.search-row .form-control{flex:1;}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{position:sticky;top:0;background:var(--bg-card);padding:7px 12px;text-align:left;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--border-1);white-space:nowrap;}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--border-0);color:var(--text-2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg-input);}

/* ── Layout ── */
.two-col{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;}
.three-row{display:flex;flex-direction:column;gap:20px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(16,185,129,.15);color:var(--green-l);}
.hidden{display:none!important;}

/* ── Empty state ── */
.empty{text-align:center;padding:32px 0;color:var(--text-3);font-size:13px;}
.empty svg{width:32px;height:32px;stroke:var(--text-3);margin:0 auto 10px;display:block;opacity:.4;}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:#1a3050;border:1px solid var(--green);color:var(--green-l);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>

<div class="page-wrap">
  <div class="page-header">
    <div class="page-title">DataSets</div>
    <div class="page-sub">Manage projects and datasets. Add records from Lead Discovery or any pipeline run.</div>
  </div>

  <div class="two-col">
    <!-- ── Left: Projects ── -->
    <div class="card">
      <div class="card-title">
        Projects
        <button id="newProjectBtn" class="btn btn-primary btn-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New
        </button>
      </div>
      <div class="search-row">
        <input id="projectSearch" class="form-control" placeholder="Search projects..." style="height:34px;font-size:12px;">
      </div>
      <div id="projectList" class="item-list">
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Loading projects...
        </div>
      </div>
    </div>

    <!-- ── Right: DataSets + Records ── -->
    <div class="three-row">
      <!-- DataSets panel -->
      <div class="card" id="dsCard">
        <div class="card-title">
          DataSets
          <div style="display:flex;align-items:center;gap:8px;">
            <span id="dsProjectName" class="hidden" style="font-size:11px;color:var(--text-3);font-weight:400;"></span>
            <button id="newDsBtn" class="btn btn-primary btn-sm hidden">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              New DataSet
            </button>
          </div>
        </div>
        <div id="dsList" class="item-list">
          <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            Select a project to view datasets
          </div>
        </div>
      </div>

      <!-- Records panel -->
      <div class="card hidden" id="recordsCard">
        <div class="card-title" id="recordsTitle">
          Records
          <div style="display:flex;align-items:center;gap:8px;">
            <button id="exportCsvBtn" class="btn btn-secondary btn-sm">Export CSV</button>
            <button id="exportJsonBtn" class="btn btn-secondary btn-sm">Export JSON</button>
            <button id="clearRecordsBtn" class="btn btn-danger btn-sm">Clear All</button>
          </div>
        </div>
        <div class="search-row">
          <input id="recordSearch" class="form-control" placeholder="Search records..." style="height:34px;font-size:12px;">
          <button id="recordSearchBtn" class="btn btn-secondary btn-sm" style="flex-shrink:0;">Search</button>
        </div>

          <table class="tbl">
            <thead id="recordsThead"></thead>
            <tbody id="recordsTbody"></tbody>

<!-- New Project Modal -->
<div id="newProjectModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--bg-card);border:1px solid var(--border-1);border-radius:14px;width:min(420px,94vw);padding:24px;display:flex;flex-direction:column;gap:14px;">
    <div style="font-size:15px;font-weight:700;color:var(--text-1);">New Project</div>
    <div><label class="form-label">Project name</label><input id="newProjName" class="form-control" placeholder="My Project" style="height:38px;"></div>
    <div><label class="form-label">Description</label><textarea id="newProjDesc" class="form-control" rows="2" placeholder="Optional description" style="resize:none;"></textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">

      <button id="createNewProj" class="btn btn-primary">Create Project</button>

</div>

<!-- New DataSet Modal -->
<div id="newDsModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;">
  <div style="background:var(--bg-card);border:1px solid var(--border-1);border-radius:14px;width:min(420px,94vw);padding:24px;display:flex;flex-direction:column;gap:14px;">
    <div style="font-size:15px;font-weight:700;color:var(--text-1);">New DataSet</div>
    <div><label class="form-label">DataSet name</label><input id="newDsName" class="form-control" placeholder="Leads - Austin TX" style="height:38px;"></div>
    <div><label class="form-label">Description</label><textarea id="newDsDesc" class="form-control" rows="2" placeholder="Optional description" style="resize:none;"></textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button id="cancelNewDs" class="btn btn-secondary">Cancel</button>
      <button id="createNewDs" class="btn btn-primary">Create DataSet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  const API = '/api';
  let token = null;
  let selectedProjectId = null;
  let selectedDataSetId = null;
  let allProjects = [];
  let currentPage = 0;
  const PAGE_SIZE = 50;

  function authHeaders() {
    return { Authorization: 'Bearer ' + (token || ''), 'Content-Type': 'application/json' };
  }

  function apiFetch(path, opts) {
    return fetch('/api/studio' + path, Object.assign({ headers: authHeaders() }, opts));
  }

  async function init() {
    token = localStorage.getItem('studioToken');
    if (!token) { location.replace('/login.html'); return; }
    await loadProjects();
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
  }

  let allDatasets = {};

  // ── Projects ─────────────────────────────────────────────────────────────
  async function loadProjects() {
    try {
      const r = await apiFetch('/projects?type=dataset&parentId=');
      allProjects = await r.json();
      renderProjects(allProjects);
    } catch(e) {
      document.getElementById('projectList').innerHTML =
        '<div class="empty" style="color:var(--red);">Failed to load projects</div>';
    }
  }

  function renderProjects(projects) {
    const el = document.getElementById('projectList');
    if (!projects.length) {
      el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>No projects yet. Click New to create one.</div>';
      return;
    }
    el.innerHTML = projects.map(p => `
      <div class="list-item${p.id === selectedProjectId ? ' active' : ''}" data-id="${p.id}">
        <div class="list-item-info">
          <div class="list-item-name">${esc(p.name)}</div>
          <div class="list-item-meta">created ${fmtDate(p.createdAt)}</div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-danger btn-sm del-proj-btn" data-id="${p.id}" title="Delete project">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    `).join('');

    el.querySelectorAll('.list-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.closest('.del-proj-btn')) return;
        selectProject(item.dataset.id);
      });
    });
    el.querySelectorAll('.del-proj-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); deleteProject(btn.dataset.id); });
    });
  }

  document.getElementById('projectSearch').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    renderProjects(allProjects.filter(p => p.name.toLowerCase().includes(q)));
  });

  async function selectProject(id) {
    selectedProjectId = id;
    selectedDataSetId = null;
    document.getElementById('recordsCard').classList.add('hidden');
    const proj = allProjects.find(p => p.id === id);
    document.getElementById('dsProjectName').textContent = proj ? proj.name : '';
    document.getElementById('dsProjectName').classList.remove('hidden');
    document.getElementById('newDsBtn').classList.remove('hidden');
    renderProjects(allProjects);
    await loadDataSets();
  }

  async function deleteProject(id) {
    if (!confirm('Delete this project and all its datasets and records?')) return;
    try {
      await apiFetch('/projects/' + id, { method:'DELETE' });
      if (id === selectedProjectId) {
        selectedProjectId = null;
        selectedDataSetId = null;
        document.getElementById('dsList').innerHTML = '<div class="empty">Select a project to view datasets</div>';
        document.getElementById('recordsCard').classList.add('hidden');
        document.getElementById('newDsBtn').classList.add('hidden');
        document.getElementById('dsProjectName').classList.add('hidden');
      }
      await loadProjects();
      toast('Project deleted');
    } catch(e) { alert('Delete failed: ' + e.message); }
  }

  // New Project modal
  document.getElementById('newProjectBtn').addEventListener('click', () => {
    document.getElementById('newProjName').value = '';
    document.getElementById('newProjDesc').value = '';
    document.getElementById('newProjectModal').classList.remove('hidden');
    document.getElementById('newProjName').focus();
  });
  document.getElementById('cancelNewProj').addEventListener('click', () => {
    document.getElementById('newProjectModal').classList.add('hidden');
  });
  document.getElementById('createNewProj').addEventListener('click', async () => {
    const name = document.getElementById('newProjName').value.trim();
    if (!name) { document.getElementById('newProjName').focus(); return; }
    try {
      await apiFetch('/projects', {
        method:'POST',
        body: JSON.stringify({ name, description: document.getElementById('newProjDesc').value.trim(), type: 'dataset', parentId: null })
      });
      document.getElementById('newProjectModal').classList.add('hidden');
      await loadProjects();
      toast('Project created');
    } catch(e) { alert('Failed: ' + e.message); }
  });

  // ── DataSets ──────────────────────────────────────────────────────────────
  async function loadDataSets() {
    const el = document.getElementById('dsList');
    el.innerHTML = '<div class="empty" style="color:var(--text-3);">Loading...</div>';
    try {
      const r = await apiFetch('/projects?type=dataset&parentId=' + selectedProjectId);
      const datasets = await r.json();
      renderDataSets(datasets);
    } catch(e) {
      el.innerHTML = '<div class="empty" style="color:var(--red);">Failed to load datasets</div>';
    }
  }

  function renderDataSets(datasets) {
    const el = document.getElementById('dsList');
    if (!datasets.length) {
      el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>No datasets. Click New DataSet to create one.</div>';
      return;
    }
    el.innerHTML = datasets.map(ds => `
      <div class="list-item${ds.id === selectedDataSetId ? ' active' : ''}" data-id="${ds.id}">
        <div class="list-item-info">
          <div class="list-item-name">${esc(ds.name)}</div>
          <div class="list-item-meta">${ds.recordCount || 0} records &middot; ${fmtDate(ds.createdAt)}</div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-danger btn-sm del-ds-btn" data-id="${ds.id}" title="Delete dataset">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    `).join('');

    el.querySelectorAll('.list-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.closest('.del-ds-btn')) return;
        selectDataSet(item.dataset.id, datasets);
      });
    });
    el.querySelectorAll('.del-ds-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); deleteDataSet(btn.dataset.id); });
    });
  }

  document.getElementById('newDsBtn').addEventListener('click', () => {
    document.getElementById('newDsName').value = '';
    document.getElementById('newDsDesc').value = '';
    document.getElementById('newDsModal').classList.remove('hidden');
    document.getElementById('newDsName').focus();
  });
  document.getElementById('cancelNewDs').addEventListener('click', () => {
    document.getElementById('newDsModal').classList.add('hidden');
  });
  document.getElementById('createNewDs').addEventListener('click', async () => {
    const name = document.getElementById('newDsName').value.trim();
    if (!name) { document.getElementById('newDsName').focus(); return; }
    try {
      await apiFetch('/projects', {
        method:'POST',
        body: JSON.stringify({ name, description: document.getElementById('newDsDesc').value.trim(), type: 'dataset', parentId: selectedProjectId })
      });
      document.getElementById('newDsModal').classList.add('hidden');
      await loadDataSets();
      toast('DataSet created');
    } catch(e) { alert('Failed: ' + e.message); }
  });

  function selectDataSet(id, datasets) {
    selectedDataSetId = id;
    renderDataSets(datasets);
    currentPage = 0;
    document.getElementById('recordSearch').value = '';
    loadRecords();
    document.getElementById('recordsCard').classList.remove('hidden');
  }

  async function deleteDataSet(id) {
    if (!confirm('Delete this dataset and all its records?')) return;
    try {
      await apiFetch('/projects/' + id, { method:'DELETE' });
      if (id === selectedDataSetId) {
        selectedDataSetId = null;
        document.getElementById('recordsCard').classList.add('hidden');
      }
      await loadDataSets();
      toast('DataSet deleted');
    } catch(e) { alert('Delete failed: ' + e.message); }
  }

  // ── Records ───────────────────────────────────────────────────────────────
  async function loadRecords(q) {
    if (!selectedDataSetId) return;
    const params = new URLSearchParams({ limit: PAGE_SIZE, offset: currentPage * PAGE_SIZE });
    if (q) params.set('search', q);
    try {
      const r = await apiFetch('/projects/' + selectedDataSetId + '/records?' + params);
      const data = await r.json();
      const records = Array.isArray(data) ? data : (data.records || []);
      const total = data.total !== undefined ? data.total : records.length;
      renderRecords(records, total, q);
    } catch(e) {
      document.getElementById('recordsTbody').innerHTML =
        '<tr><td colspan="20" style="color:var(--red);text-align:center;">Failed to load records</td></tr>';
    }
  }

  function flattenRecord(rec, prefix, out) {
    out = out || {};
    for (const key of Object.keys(rec)) {
      const val = rec[key];
      const full = prefix ? prefix + '.' + key : key;
      if (val && typeof val === 'object' && !Array.isArray(val)) {
        flattenRecord(val, full, out);
      } else {
        out[full] = Array.isArray(val) ? val.join(', ') : (val ?? '');
      }
    }
    return out;
  }

  function renderRecords(records, total, q) {
    const thead = document.getElementById('recordsThead');
    const tbody = document.getElementById('recordsTbody');
    const count = document.getElementById('recordsCount');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    count.textContent = `${total} records total`;
    pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;

    if (!records.length) {
      thead.innerHTML = '';
      tbody.innerHTML = '<tr><td style="text-align:center;padding:24px;color:var(--text-3);">No records found</td></tr>';
      return;
    }

    // Flatten all records to get column set
    const flat = records.map(r => flattenRecord(r, '', {}));
    const cols = [...new Set(flat.flatMap(r => Object.keys(r)))].slice(0, 12);
    thead.innerHTML = '<tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    tbody.innerHTML = flat.map(r =>
      '<tr>' + cols.map(c => `<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(String(r[c] ?? ''))}</td>`).join('') + '</tr>'
    ).join('');
  }

  document.getElementById('recordSearchBtn').addEventListener('click', () => {
    currentPage = 0;
    loadRecords(document.getElementById('recordSearch').value.trim());
  });
  document.getElementById('recordSearch').addEventListener('keydown', e => {
    if (e.key === 'Enter') { currentPage = 0; loadRecords(e.target.value.trim()); }
  });
  document.getElementById('prevPageBtn').addEventListener('click', () => { currentPage--; loadRecords(document.getElementById('recordSearch').value.trim()); });
  document.getElementById('nextPageBtn').addEventListener('click', () => { currentPage++; loadRecords(document.getElementById('recordSearch').value.trim()); });

  document.getElementById('clearRecordsBtn').addEventListener('click', async () => {
    if (!confirm('Clear ALL records from this dataset? This cannot be undone.')) return;
    try {
      await apiFetch('/projects/' + selectedDataSetId + '/records', { method:'DELETE' });
      currentPage = 0;
      await loadRecords();
      await loadDataSets();
      toast('Records cleared');
    } catch(e) { alert('Failed: ' + e.message); }
  });

  async function exportRecords(format) {
    if (!selectedDataSetId) return;
    const r = await apiFetch('/projects/' + selectedDataSetId + '/records?limit=10000');
    const data = await r.json();
    const records = Array.isArray(data) ? data : (data.records || []);
    let content, mime, ext;
    if (format === 'json') {
      content = JSON.stringify(records, null, 2);
      mime = 'application/json'; ext = 'json';
    } else {
      function flat(obj, prefix) { const out = {}; for (const k of Object.keys(obj)) { const v = obj[k]; const key = prefix ? prefix + '.' + k : k; if (v && typeof v === 'object' && !Array.isArray(v)) Object.assign(out, flat(v, key)); else out[key] = Array.isArray(v) ? v.join('; ') : String(v ?? ''); } return out; }
      const rows = records.map(r => flat(r, ''));
      const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
      const csv = [cols.join(','), ...rows.map(r => cols.map(c => JSON.stringify(r[c] || '')).join(','))].join('\n');
      content = csv; mime = 'text/csv'; ext = 'csv';
    }
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dataset-export.' + ext;
    a.click();
  }
  document.getElementById('exportCsvBtn').addEventListener('click', () => exportRecords('csv'));
  document.getElementById('exportJsonBtn').addEventListener('click', () => exportRecords('json'));

  // ── Helpers ───────────────────────────────────────────────────────────────
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString(); } catch(e) { return iso; }
  }

  init();
}());
</script>
</body>
</html>
