<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authenticating…</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0f1117;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #a0aec0;
    font-size: 15px;
  }
  .msg { text-align: center; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #2d3748;
    border-top-color: #4a9eed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #fc8181; }
</style>
</head>
<body>
<div class="msg" id="msg">
  <div class="spinner"></div>
  <div>Completing sign-in…</div>
</div>
<script>
(function () {
    const hash   = location.hash.slice(1);
    const params = new URLSearchParams(hash);
    const token  = params.get('token');
    const error  = params.get('error');

    if (token) {
        localStorage.setItem('studioToken', token);
        location.replace('/');
    } else {
        const msg = document.getElementById('msg');
        msg.innerHTML = `<div class="error">Sign-in failed: ${error || 'unknown error'}</div>
            <div style="margin-top:16px"><a href="/login.html" style="color:#4a9eed">Try again</a></div>`;
    }
})();
</script>
</body>
</html>
